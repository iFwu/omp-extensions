name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-omp:
    name: Prepare OMP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned host version
        id: host
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["devDependencies"]["@oh-my-pi/pi-coding-agent"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/omp-standalone
          key: omp-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.version }}
      - name: Check host download handling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Download pinned official host
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci-omp.py --download "$RUNNER_TEMP/omp-standalone"
      - name: Verify restored host
        if: steps.cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci-omp.py "$RUNNER_TEMP/omp-standalone"
      - uses: actions/upload-artifact@v4
        with:
          name: omp-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/omp-standalone/omp-*
            ${{ runner.temp }}/omp-standalone/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  verify:
    needs: prepare-omp
    name: ${{ matrix.slice.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        slice:
          - name: composer
            command: bun run --filter @ifwu/omp-composer test
          - name: transcript-grouping
            command: bun run --filter @ifwu/omp-transcript-grouping test
          - name: ask-history
            command: bun run --filter @ifwu/omp-ask-history test
          - name: skill-completion
            command: bun run --filter @ifwu/omp-skill-completion test
          - name: model-switch
            command: bun run --filter @ifwu/omp-model-switch test
          - name: next-step
            command: bun run --filter @ifwu/omp-next-step test
          - name: secret
            command: bun run --filter @ifwu/omp-secret test
          - name: integration
            command: bun run test:integration
          - name: package
            command: bun run typecheck && bun run smoke:package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: omp-${{ matrix.os }}
          path: ${{ runner.temp }}/omp-standalone
      - name: Verify and activate prepared host
        shell: bash
        run: |
          python3 scripts/ci-omp.py "$RUNNER_TEMP/omp-standalone"
          echo "$RUNNER_TEMP/omp-standalone" >> "$GITHUB_PATH"
          echo "OMP_BIN=$RUNNER_TEMP/omp-standalone/omp" >> "$GITHUB_ENV"
      - name: Install development dependencies
        run: |
          bun install --frozen-lockfile
          python3 -m pip install pyte==0.8.2 PyYAML==6.0.3 pexpect==4.9.0
      - name: Run ${{ matrix.slice.name }} checks
        run: ${{ matrix.slice.command }}
